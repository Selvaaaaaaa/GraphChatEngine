# =============================================================
# docker-compose.yml
# GraphChatEngine – Milestone 01: Project Foundation
#
# Services:
#   kafka    – Apache Kafka 3.7 in KRaft mode (no ZooKeeper)
#   neo4j    – Neo4j Community 5.x graph database
#   api      – FastAPI backend (Python 3.11)
#   loader   – Internal worker service (Python 3.11)
#
# All services share the `graphchat-net` bridge network.
# =============================================================

services:

  # -----------------------------------------------------------
  # Apache Kafka 3.7 – KRaft mode (no ZooKeeper required)
  # Image: apache/kafka:3.7.0
  # -----------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: graphchat-kafka
    restart: unless-stopped
    networks:
      - graphchat-net

    ports:
      - "9092:9092"   # External / host access (PLAINTEXT_HOST listener)

    environment:
      # --- KRaft identity ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller   # Combined mode (single node)

      # --- Listeners ---
      # PLAINTEXT       → used inside the Docker network
      # PLAINTEXT_HOST  → used when connecting from the host machine
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- KRaft controller ---
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # --- Cluster ID (fixed so restarts are idempotent) ---
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      # --- Broker tuning ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168          # 7 days
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


  # -----------------------------------------------------------
  # Neo4j Community Edition 5.x
  # Image: neo4j:5.19-community
  # -----------------------------------------------------------
  neo4j:
    image: neo4j:5.19-community
    container_name: graphchat-neo4j
    restart: unless-stopped
    networks:
      - graphchat-net

    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt protocol (driver connections)

    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
      # Allow unauthenticated connections to the browser in dev
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      # Increase JVM heap for larger graphs (adjust as needed)
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1g"

    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s


  # -----------------------------------------------------------
  # GraphChatEngine API – FastAPI (Python 3.11)
  # Built from ./api/Dockerfile
  # -----------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: graphchat-api:latest
    container_name: graphchat-api
    restart: unless-stopped
    networks:
      - graphchat-net

    ports:
      - "8000:8000"   # FastAPI / Uvicorn

    environment:
      # Service URLs (used in later milestones)
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}"
      NEO4J_URI:      "${NEO4J_URI:-bolt://neo4j:7687}"
      NEO4J_USER:     "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-changeme}"
      # Application settings
      APP_ENV:        "${APP_ENV:-development}"
      LOG_LEVEL:      "${LOG_LEVEL:-info}"

    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health > /dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s


  # -----------------------------------------------------------
  # GraphChatEngine Loader – Internal Worker (Python 3.11)
  # Built from ./loader/Dockerfile
  # -----------------------------------------------------------
  loader:
    build:
      context: ./loader
      dockerfile: Dockerfile
    image: graphchat-loader:latest
    container_name: graphchat-loader
    restart: unless-stopped
    networks:
      - graphchat-net

    environment:
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}"
      NEO4J_URI:      "${NEO4J_URI:-bolt://neo4j:7687}"
      NEO4J_USER:     "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-changeme}"
      APP_ENV:        "${APP_ENV:-development}"
      LOG_LEVEL:      "${LOG_LEVEL:-info}"

    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy


# =============================================================
# Named volumes (data persists across container restarts)
# =============================================================
volumes:
  kafka-data:
    driver: local
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local


# =============================================================
# Shared network
# All services communicate over this bridge network.
# =============================================================
networks:
  graphchat-net:
    driver: bridge
    name: graphchat-net
