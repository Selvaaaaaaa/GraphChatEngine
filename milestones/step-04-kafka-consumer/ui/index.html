<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GraphChatEngine – CSV to Neo4j knowledge-graph chatbot" />
  <title>GraphChatEngine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <!-- Hero heading -->
    <h1 class="hero-title">
      CSV <span class="arrow">→</span> Kafka <span class="arrow">→</span> Neo4j Chatbot
    </h1>

    <!-- Status banner -->
    <div class="status-card" id="statusCard">
      <span class="status-dot" id="statusDot"></span>
      <p class="status-text" id="statusText">System Initializing…</p>
    </div>

    <!-- Pipeline visual (decorative for Milestone 01) -->
    <div class="pipeline">
      <div class="pipeline-step">
        <div class="step-icon">📄</div>
        <div class="step-label">CSV Upload</div>
      </div>
      <div class="pipeline-arrow">→</div>
      <div class="pipeline-step">
        <div class="step-icon">⚡</div>
        <div class="step-label">Kafka</div>
      </div>
      <div class="pipeline-arrow">→</div>
      <div class="pipeline-step">
        <div class="step-icon">🔗</div>
        <div class="step-label">Neo4j Graph</div>
      </div>
      <div class="pipeline-arrow">→</div>
      <div class="pipeline-step">
        <div class="step-icon">🤖</div>
        <div class="step-label">Chat</div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
